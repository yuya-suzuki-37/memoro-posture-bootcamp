<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30日間姿勢改善ブートキャンプ プレビュー｜Memoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
<link rel="stylesheet" href="program.css?v=5">
<style>
  body{ background:#FFFDFA; }
  .preview-note{ max-width:960px; margin:0 auto; padding:18px 24px; background:#FBF3E6; border-bottom:1px solid #E7DED2; font-family:"Zen Kaku Gothic New",sans-serif; font-size:13px; color:#6B5A3E; line-height:1.8; }
  .preview-note b{ color:#9A6A2F; }
  .pv-wrap{ max-width:960px; margin:0 auto; padding:24px; }
  .pv-label{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; letter-spacing:.16em; color:#9A794F; font-weight:700; margin-bottom:8px; }
  .case-picker{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px; }
  .case-picker button{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:12.5px; padding:8px 14px; border:1px solid #D8C6A8; background:#fff; border-radius:20px; cursor:pointer; color:#5A4A2E; transition:.15s; }
  .case-picker button:hover{ border-color:#B4936A; }
  .case-picker button.active{ background:#33302B; color:#F3ECE3; border-color:#33302B; }
</style>
</head>
<body>
<div class="bc-banner">
  <span class="bc-eyebrow">MEMORO PHOTO WEDDING</span>
  <span class="bc-title"><span class="bc-ico">🧍‍♀️</span>30日間<b>姿勢改善</b>ブートキャンプ</span>
</div>
<div class="preview-note">
  🔎 <b>これは「30日プログラム画面」だけを確認するためのプレビューです</b>（診断エンジンは経由していません）。
  下のボタンで“診断結果のパターン”を切り替えると、その人向けの30日メニューがどう変わるかを確認できます。
  本番は <b>「写真2枚アップ → 姿勢診断 → この30日プログラムが自動生成」</b> の流れです（本体は <code>index.html</code>）。
</div>
<div class="pv-wrap">
  <div class="pv-label">診断結果パターンを選ぶ（＝どんな姿勢の人か）</div>
  <div class="case-picker" id="picker"></div>
  <main id="result"></main>
</div>

<script type="module">
  import { render30DayProgram } from './program-ui.js';

  // 診断が出す problems を模擬（本番は analyzer.js が自動生成）
  const CASES = [
    { label:'頭前傾＋巻き肩＋反り腰', keys:['forwardHead','roundedShoulders','anteriorPelvicTilt'] },
    { label:'左右差＋X脚',           keys:['lateralAsymmetry','kneeValgus'] },
    { label:'猫背のみ',             keys:['thoracicKyphosis'] },
    { label:'スウェイバック＋O脚',   keys:['swayBack','kneeVarus'] },
    { label:'複合フル',             keys:['forwardHead','roundedShoulders','thoracicKyphosis','anteriorPelvicTilt','swayBack','lateralAsymmetry','kneeValgus'] },
    { label:'良好（general）',       keys:['general'] },
  ];

  const picker = document.getElementById('picker');
  const result = document.getElementById('result');

  function show(i){
    [...picker.children].forEach((b,j)=> b.classList.toggle('active', i===j));
    const problems = CASES[i].keys.map(k => ({ key:k })); // render30DayProgram は p.key を見る
    render30DayProgram(problems, result);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  CASES.forEach((c,i)=>{
    const b = document.createElement('button');
    b.textContent = c.label;
    b.addEventListener('click', ()=> show(i));
    picker.appendChild(b);
  });
  show(0);
</script>
</body>
</html>
